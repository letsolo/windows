name: Publisher identity

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify Vapor commit and push identities
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_ACTOR: ${{ github.actor }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          bot='letsolo-vapor[bot]'
          identity='letsolo-vapor[bot] <353304076+letsolo-vapor[bot]@users.noreply.github.com>'
          if [[ "$EVENT_NAME" == push ]]; then
            [[ "$PUSH_ACTOR" == "$bot" ]]
          fi
          revisions=("$HEAD_SHA")
          if [[ -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            revisions=("${EVENT_BEFORE}..${HEAD_SHA}")
          fi
          commits="$(git rev-list "${revisions[@]}")"
          while IFS= read -r sha; do
            [[ "$(git show -s --format='%an <%ae>' "$sha")" == "$identity" ]]
            [[ "$(git show -s --format='%cn <%ce>' "$sha")" == "$identity" ]]
          done <<< "$commits"
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" --jq '.author.login')" == "$bot" ]]
          [[ "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" --jq '.committer.login')" == "$bot" ]]
      - name: Check public repository privacy
        run: python3 -I scripts/check-repository.py
