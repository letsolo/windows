name: Publisher identity

on:
  push:
  workflow_dispatch:

permissions: {}

jobs:
  verify:
    if: github.event.deleted != true
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate as the publisher App
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
          owner: letsolo
          repositories: ${{ github.event.repository.name }}
          permission-contents: read

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.bot.outputs.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify bot author, committer, and push actor
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          BOT_SLUG: ${{ steps.bot.outputs.app-slug }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          bot_name="${BOT_SLUG}[bot]"
          bot_id="$(gh api "/users/${bot_name}" --jq '.id')"
          bot_email="${bot_id}+${bot_name}@users.noreply.github.com"
          expected="${bot_name} <${bot_email}>"
          if [[ "$EVENT_NAME" == push && "$PUSH_ACTOR" != "$bot_name" ]]; then
            printf '%s\n' 'Push was not authenticated as the publisher App.' >&2
            exit 1
          fi
          revisions=("$HEAD_SHA")
          if [[ "$EVENT_NAME" == push && -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            revisions=("${EVENT_BEFORE}..${HEAD_SHA}")
          fi
          commit_list="$(git rev-list "${revisions[@]}")"
          while IFS= read -r sha; do
            [[ "$(git show -s --format='%an <%ae>' "$sha")" == "$expected" ]]
            [[ "$(git show -s --format='%cn <%ce>' "$sha")" == "$expected" ]]
          done <<< "$commit_list"
          author="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}" --jq '.author.login')"
          committer="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}" --jq '.committer.login')"
          [[ "$author" == "$bot_name" && "$committer" == "$bot_name" ]]
          printf 'Verified %s as author and committer.\n' "$bot_name"
